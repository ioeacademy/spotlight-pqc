<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick VPN Labs</title>
  <meta name="description" content="Short simulated Cisco IOS XE labs: a classic IKEv2 VPN, a post-quantum ML-KEM VPN, the migration from classic to post-quantum, and negotiation experiments.">
  <link rel="stylesheet" href="../v3-three-router/css/style.css?v=20261009a">
  <link rel="stylesheet" href="css/negotiation.css?v=20261009c">
</head>
<body>
  <header class="lab-nav">
    <a class="nav-home" href="../../index.html">&larr; Spotlight-PQC</a>
    <span class="nav-sep"></span>
    <span class="badge">Quick lab</span>
    <h1 class="nav-title">Quick VPN Labs</h1>
    <span class="nav-spacer"></span>
    <a class="edu-badge" href="https://github.com/ioeacademy/spotlight-pqc/blob/main/DISCLAIMER.md" target="_blank" rel="noopener" title="Educational simulator: output may differ from real routers. Not for validating configurations. Provided as is, without support.">🎓 Education only</a>
    <span class="fs-group" role="group" aria-label="Text size">
      <button class="fs-btn" data-fs="s" aria-pressed="true" title="Normal text">A</button><button class="fs-btn" data-fs="m" aria-pressed="false" title="Larger text">A</button><button class="fs-btn" data-fs="l" aria-pressed="false" title="Largest text">A</button>
    </span>
    <span class="nav-progress" id="nav-progress" aria-live="polite">0 / 0</span>
    <button class="btn ghost" id="btn-reset" title="Reset all routers and progress">Reset lab</button>
  </header>

  <main class="split">
    <section class="tutorial" id="tutorial" aria-label="Tutorial steps">
      <div class="tut-head">
        <div class="tut-kicker">Short lab</div>
        <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <ol class="steps" id="steps"></ol>
    </section>

    <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize"></div>

    <section class="labpane" aria-label="Lab">
      <div class="topo-wrap" id="topo-wrap">
        <div class="topo-toolbar">
          <span class="legend"><i class="sw classic"></i>Classical</span>
          <span class="legend"><i class="sw ppk"></i>PPK</span>
          <span class="legend"><i class="sw pqc"></i>ML-KEM</span>
          <span class="legend"><i class="sw neg"></i>Negotiating / down</span>
          <span class="topo-hint">Click a router for its console · click a tunnel to inspect the handshake</span>
        </div>
        <svg id="topo" viewBox="70 12 820 270" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Topology: R1, R2 and R3 in a row"></svg>
      </div>
      <div class="hresizer" id="hresizer" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>
      <div class="console">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="terms" id="terms"></div>
      </div>
    </section>
  </main>

  <div class="modal-bg" id="modal-bg" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Handshake inspector</h2>
        <button class="btn ghost icon" id="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="../v3-three-router/js/ios-pqc-engine.js?v=20261009b"></script>
  <script src="../v3-three-router/js/lab-topology.js?v=20261006a"></script>
  <script src="js/quick-steps.js?v=20261009c"></script>
  <script src="js/negotiation-panel.js?v=20261009c"></script>
  <script src="../v3-three-router/js/app.js?v=20261009b"></script>
</body>
</html>
